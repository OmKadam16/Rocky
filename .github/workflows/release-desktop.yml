# Desktop (Windows) release: push a tag v<package.json version>.
#   git tag v0.1.15 && git push --tags
# Builds the NSIS installer and publishes it with latest.yml and the
# blockmap to the PUBLIC repo OmKadam16/rocky-releases; installed apps find
# it through electron-updater. Windows builds aren't code-signed.
#
# Secrets: RELEASES_REPO_TOKEN (fine-grained, Contents: read and write on the
# releases repos only), VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_PUBLIC_URL.
name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "Tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Check build secrets (names only, never values)
        shell: bash
        run: node scripts/check-build-env.mjs VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_PUBLIC_URL
      # Prove the publish token before the long build: valid auth, then
      # reachability of the releases repo. If this passes and publish still
      # fails, the token needs Contents read+write on rocky-releases.
      - name: Preflight releases-repo token (names only, never values)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "RELEASES_REPO_TOKEN is empty or missing."; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/rate_limit)
          echo "token auth check status: $code"
          [ "$code" = "200" ] || { echo "RELEASES_REPO_TOKEN was rejected (HTTP $code): bad, expired, or mangled value. Re-set it from a BOM-free file."; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/OmKadam16/rocky-releases)
          echo "releases repo check status: $code"
          [ "$code" = "200" ] || { echo "Cannot reach rocky-releases (HTTP $code)."; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build:electron
      - name: Build and publish the installer
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: npx electron-builder --win --publish always
